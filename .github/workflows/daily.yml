name: daily-loot

on:
  schedule:
    # UTC 08:05 / 09:05 = 北京 16:05 / 17:05，第二次是防源站更新延迟的保险
    - cron: "5 8,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-loot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成数据
        run: python scripts/fetch.py

      - name: 提交变更
        run: |
          git config user.name "td2-loot-bot"
          git config user.email "td2-loot-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
          git push
